<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F3F9" />
    <title>暂时离线 · 言行</title>
    <style>
      :root {
        color: #16141c;
        background: #f5f3f9;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
      }

      main {
        width: min(100%, 440px);
        border-radius: 24px;
        padding: 32px 28px;
        background: #fff;
        box-shadow: 0 16px 36px rgb(37 33 48 / 12%);
      }

      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 15px;
        background: #8ba7e9;
        color: #fff;
        font-size: 21px;
        font-weight: 700;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
        line-height: 1.35;
      }

      p {
        margin: 0;
        color: #676372;
        font-size: 14px;
        line-height: 1.75;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        border-radius: 12px;
        padding: 0 18px;
        background: #292635;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">言</div>
      <h1>暂时无法连接网络</h1>
      <p>
        为了保护你的数据，离线时不会显示聊天、记忆、计划或账号内容，也不能提交修改。恢复网络后，请重新打开言行。
      </p>
      <a href="/login">恢复连接后重试</a>
    </main>
  </body>
</html>
