<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>言行 V0 原型生成器</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei", sans-serif;
        background: #f7f4ee;
        color: #2f3542;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      .panel {
        padding: 20px;
        border: 1px solid #ded8cd;
        border-radius: 16px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      p {
        margin: 0;
        color: #687080;
        line-height: 1.6;
      }

      #status[data-ready="true"] {
        color: #596a8a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>言行 V0 原型生成器</h1>
      <p id="status" role="status" data-ready="false">正在连接 Figma…</p>
    </main>
    <script>
      const status = document.getElementById("status");

      window.onmessage = (event) => {
        if (event.data.pluginMessage?.type === "READY") {
          status.textContent = "已连接，可以开始生成。";
          status.dataset.ready = "true";
        }
      };

      parent.postMessage({ pluginMessage: { type: "PING" } }, "*");
    </script>
  </body>
</html>
